server {
    listen 80;
    client_max_body_size 20M;

    # 1. Telegram Mini App (под префиксом /tma/)
    location /tma/ {
        alias /usr/share/nginx/html/tma/;
        try_files $uri $uri/ /tma/index.html;
    }

    # 2. REST API бэкенда
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Django Admin Panel (скрыта под /administrator/)
    location /administrator/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Статика Django Admin — раздаётся напрямую Nginx из общего тома
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # 5. Веб-сокеты (Django Channels / Daphne)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Медиа-файлы (загруженные логотипы и т.д.)
    location /media/ {
        alias /app/media/;
    }

    # 7. Панель управления / Веб-приложение (Vue SPA)
    # Открывается при нажатии "Войти" (/login) и по внутренним маршрутам админки
    location ~* ^/(login|select-org|superadmin|admin|assets|vite\.svg) {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
    }

    # 8. Главная страница (Лендинг) и документы Политики / Условий
    location / {
        root /usr/share/nginx/html/website;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
